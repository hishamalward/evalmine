[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalmine"
version = "0.1.0"
description = "A public, Python eval harness that scores a model change against your own tasks - pairwise LLM-judge win-rates calibrated to your labels, schema-pass rate, latency and cost - and writes a versioned report."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Hisham Al-Ward" }]
keywords = ["llm", "eval", "benchmark", "llm-judge", "calibration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "httpx>=0.27",
]

[project.optional-dependencies]
# MCP is an optional extra for dependency weight, not for Python version:
# the extra's floor and the package's floor are both 3.10 (spec S12, ruling O-1).
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
evalmine = "evalmine.cli:main"
# evalmine-mcp is declared once src/evalmine/mcp_server.py exists (next round).

[tool.hatch.build.targets.wheel]
packages = ["src/evalmine"]

[tool.hatch.build.targets.wheel.force-include]
# The pinned price tables live at the repo root (spec S3) and ship inside the
# package so an installed evalmine can price a model from any directory.
"prices" = "evalmine/prices"

[tool.hatch.build.targets.sdist]
include = ["src", "prices", "examples", "docs", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
