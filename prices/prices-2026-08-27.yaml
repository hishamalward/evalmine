# evalmine price table, pinned by date. Spec: docs/spec.md S6.3.
#
# Re-verified 2026-08-27 against the providers' official pricing pages. Cache
# write rates and long-context multipliers are retained so subscription-backed
# runner usage can be translated into an explicitly non-billed API list-price
# equivalent in evidence reports.

pinned: 2026-08-27
currency: USD
verified: true
notes: >
  Prices per million tokens. API list-price equivalents are estimates, not
  subscription charges. Anthropic rows use standard/global first-party rates;
  US-only inference is 1.1x and must not be assumed when inference geography is
  unavailable. There is no fallback price for an unknown model.

models:
  - model: anthropic/claude-sonnet-4-6
    input_per_mtok: 3.00
    output_per_mtok: 15.00
    cached_input_per_mtok: 0.30
    cache_write_5m_per_mtok: 3.75
    cache_write_1h_per_mtok: 6.00
    source: https://platform.claude.com/docs/en/about-claude/pricing
    read_on: 2026-08-27
    verified: true

