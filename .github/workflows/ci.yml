name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-kit:
    name: TypeScript harness kit / node20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/harness-kit/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install harness kit
        run: npm ci --prefix packages/harness-kit

      - name: Test harness kit
        run: npm test --prefix packages/harness-kit

      - name: Install EvalMine
        run: python -m pip install -e ".[dev]"

      - name: Round-trip a synthetic TypeScript bundle through EvalMine
        shell: bash
        run: |
          npm run generate-fixture --prefix packages/harness-kit -- "${RUNNER_TEMP}/harness-bundle"
          python -m evalmine.cli experiment import "${RUNNER_TEMP}/harness-bundle" \
            --out "${RUNNER_TEMP}/harness-evidence"
          python -m evalmine.cli experiment verify "${RUNNER_TEMP}/harness-evidence"

  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ruling O-1: one matrix, floor 3.10, no version skips. Every leg runs
        # every test.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        # No test in this repository makes a network call, and no API key is
        # set on any leg: the whole suite runs against the fake adapter.
        run: python -m pytest -q

      - name: The example suite runs end to end
        run: |
          python -m evalmine.cli validate examples/everyday-eight.yaml
          python -m evalmine.cli run examples/everyday-eight.yaml \
            --models anthropic/claude-haiku-4-5,google/gemini-2.5-flash \
            --fake --out "${RUNNER_TEMP}/reports" --cache-dir "${RUNNER_TEMP}/cache"
        shell: bash

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No key-shaped string anywhere in the tree or its history
        shell: bash
        run: |
          set -euo pipefail
          # The same patterns suite.py refuses to load. A match is a hard fail;
          # keys come from the environment and from nowhere else.
          pattern='sk-ant-[A-Za-z0-9_-]{8,}|\bsk-(proj-)?[A-Za-z0-9_-]{16,}|\bAIza[0-9A-Za-z_-]{20,}'
          if git grep -InE "$pattern" -- .; then
            echo "::error::a key-shaped string is present in the working tree"
            exit 1
          fi
          # History: two early commits once carried a literal key-shaped test
          # fixture (in tests/test_suite.py and tests/test_cache.py). History
          # was rewritten so neither literal exists in any commit; both
          # fixtures are now assembled at runtime instead. No exclusion is
          # needed anywhere in this scan.
          if git log -p --all -- . | grep -nE "$pattern"; then
            echo "::error::a key-shaped string is present in the history"
            exit 1
          fi
          echo "clean"
